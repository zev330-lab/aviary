<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aviary">
<meta name="theme-color" content="#FFF8EC">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Havi's Aviary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Grandstander:wght@600;800&display=swap">
<style>
:root{
  --sky1:#9FD6EE; --sky2:#FFF0D4; --paper:#FFF8EC; --card:#FFFFFF; --ink:#1F3047; --ink2:#53637A;
  --line:#EADCC4; --leaf:#3D8C58; --leaf2:#2A6A41; --sun:#FFB836; --sun-d:#D08A10; --cheek:#EE7A36;
  --rose:#D6336C; --focus:#2F7FD0;
  --display:'Grandstander','Chalkboard SE','Comic Sans MS',system-ui,sans-serif;
  --body:'Atkinson Hyperlegible','Trebuchet MS',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:6px 120px}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:800;margin:0;text-wrap:balance;line-height:1.1}
p{margin:0}
.fine{font-size:14px;color:var(--ink2)}
.eyebrow{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--leaf2);font-weight:700}

/* headers */
.hero{padding-block:14px 16px;display:grid;gap:8px}
.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hero h1{font-size:clamp(40px,12vw,58px);letter-spacing:-.01em}
.hero h1 em{font-style:normal;color:var(--cheek)}
.lede{color:var(--ink2);max-width:36ch}
.top{display:flex;align-items:center;gap:12px;padding-block:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);z-index:6}
.top .ttl{flex:1;min-width:0}
.top h1{font-size:clamp(26px,7.4vw,34px);overflow-wrap:anywhere}
.top .sub{font-size:14px;color:var(--ink2)}
.icon-btn{flex:0 0 auto;width:50px;height:50px;border-radius:17px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.icon-btn svg{width:24px;height:24px}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

/* aviary grid */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:540px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{border:0;padding:0;background:var(--card);border-radius:24px;overflow:hidden;text-align:left;display:flex;flex-direction:column;box-shadow:0 4px 0 var(--line),0 14px 26px -18px rgba(31,48,71,.45)}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.thumb{position:relative;aspect-ratio:4/5;overflow:hidden;background:linear-gradient(180deg,var(--sky1),#CFEAF3 60%,var(--sky2))}
.thumb svg{position:absolute;inset:0;width:100%;height:100%}
.card .meta{padding:10px 12px 13px;display:grid;gap:1px}
.card b{font-family:var(--display);font-size:21px;line-height:1.1;overflow-wrap:anywhere}
.card .meta span{font-size:14px;color:var(--ink2)}
.card .knows{color:var(--leaf2)!important;font-weight:700}
.card.new{background:transparent;border:3px dashed var(--line);box-shadow:none}
.card.new .thumb{background:transparent}

/* stage */
.stage{position:relative;height:min(52vh,500px);min-height:300px;border-radius:30px;overflow:hidden;background:linear-gradient(180deg,var(--sky1) 0%,#CFEAF3 55%,var(--sky2) 100%);box-shadow:inset 0 -40px 60px -50px rgba(42,106,65,.6)}
.stage.small{height:min(40vh,360px);min-height:260px}
.stage > svg, .stage > .layer > svg{position:absolute;inset:0;width:100%;height:100%}
.stage .layer{position:absolute;inset:0}
.stage .bird-svg{touch-action:none}
.sunspot{position:absolute;right:-18%;top:-22%;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,248,222,.95),rgba(255,231,168,.45) 42%,rgba(255,231,168,0) 70%);pointer-events:none}
.bird-svg .ov{pointer-events:none}
.flash{animation:flash .5s ease 2}
@keyframes flash{50%{opacity:.35}}
.bubble{position:absolute;max-width:64%;padding:10px 15px 11px;border-radius:22px;font-family:var(--display);font-weight:800;font-size:clamp(19px,5.4vw,25px);line-height:1.15;box-shadow:0 8px 20px -10px rgba(0,0,0,.45);z-index:3;overflow-wrap:anywhere;pointer-events:none}
.bubble.bird{right:12px;top:14px;background:#fff;color:var(--ink);border-bottom-left-radius:6px}
.bubble.kid{left:12px;bottom:14px;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.bubble small{display:block;font-family:var(--body);font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.65;margin-bottom:2px}
.pop{animation:pop .38s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.55);opacity:0}to{transform:none;opacity:1}}
.love{position:absolute;left:12px;top:14px;background:rgba(255,255,255,.88);border-radius:999px;padding:5px 12px 6px;font-weight:700;color:var(--rose);font-size:16px;z-index:2}
.hint{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(31,48,71,.72);color:#fff;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis;z-index:2;transition:opacity .5s}
.heart{position:absolute;color:var(--rose);font-size:26px;pointer-events:none;z-index:4;animation:floatUp 1.4s ease-out forwards}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.6);opacity:0}15%{opacity:1}to{transform:translate(calc(-50% + var(--dx)),-110px) scale(1.2);opacity:0}}

/* tabs & panels */
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#F2E7D2;padding:6px;border-radius:22px;margin-block:14px 14px}
.tabs button{border:0;background:transparent;border-radius:16px;padding:12px 4px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink2)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.panel{display:grid;gap:16px}
.panel h3{font-size:21px;margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:0;border-radius:24px;padding:14px 14px 15px;min-height:112px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;gap:8px;text-align:left;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.1;color:var(--ink);box-shadow:0 4px 0 rgba(31,48,71,.14)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(31,48,71,.14)}
.tile svg{width:40px;height:40px}
.tile small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--ink2);margin-top:3px}
.t1{background:#FFE6A8}.t2{background:#FFD6C4}.t3{background:#D3EBFA}.t4{background:#D8EFD0}
.fact{background:#E6F3DF;border-radius:22px;padding:14px 16px 12px;display:grid;gap:6px}
.fact p{font-size:18px}
.stars{display:flex;gap:18px;flex-wrap:wrap;font-size:15px;color:var(--ink2)}
.stars b{color:var(--sun-d);letter-spacing:2px}
.linkbtn{border:0;background:none;padding:4px 0;color:var(--leaf2);font-weight:700;justify-self:start;text-decoration:underline;text-underline-offset:3px}

.btn{border:2px solid var(--line);border-radius:18px;padding:13px 16px;font-family:var(--display);font-weight:800;font-size:19px;background:var(--card);box-shadow:0 4px 0 var(--line);display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1}
.btn svg{width:22px;height:22px}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.go{background:var(--sun);border-color:#EAA320;box-shadow:0 4px 0 var(--sun-d)}
.btn.go:active{box-shadow:0 1px 0 var(--sun-d)}
.btn.danger{color:#B3261E;width:100%}
.btn.big{font-size:22px;padding:16px 18px;width:100%}
.btn[disabled]{opacity:.5}
.btn.rec{background:#E4413B;border-color:#B3261E;color:#fff;box-shadow:0 4px 0 #8E1C16;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{filter:brightness(1.15)}}
#micBtn{-webkit-touch-callout:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:9px 14px;font-weight:700;font-size:16px;box-shadow:0 2px 0 var(--line);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff;box-shadow:none}
.chip i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 0 0 2.5px rgba(31,48,71,.18)}
.chip i + i{margin-left:-9px}

/* teach */
.lesson{background:var(--card);border-radius:26px;padding:16px;box-shadow:0 4px 0 var(--line);display:grid;gap:12px}
.lesson .phrase{font-family:var(--display);font-weight:800;font-size:clamp(26px,7.5vw,34px);line-height:1.1;overflow-wrap:anywhere}
.dots{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.dot{width:18px;height:18px;border-radius:50%;background:#EFE4CE}
.dot.on{background:var(--leaf)}
.dots .lbl{font-size:14px;color:var(--ink2);margin-left:4px}
.lesson .row{display:flex;gap:10px}
.lesson .row .btn.big{flex:1}
.custom{display:flex;gap:8px}
.custom input,.namerow input,.sheet input{flex:1;min-width:0;font:inherit;font-size:18px;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.known{display:flex;flex-wrap:wrap;gap:8px}
.word{display:inline-flex;align-items:stretch;border-radius:16px;background:#FFF1CF;border:2px solid #F3D78F;overflow:hidden}
.word button{border:0;background:none;padding:9px 12px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:6px}
.word button svg{width:16px;height:16px}
.word .x{padding:9px 10px;color:var(--ink2);border-left:2px solid #F3D78F}
.word.learning{background:#F5F0E6;border-color:var(--line)}
.word.learning .x{border-color:var(--line)}
.note{background:#FFF1CF;border-radius:22px;padding:16px;font-size:18px}
.empty{color:var(--ink2);font-size:15px}

/* xylophone */
.xylo{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:6px;align-items:center;height:168px;padding:12px 10px;background:linear-gradient(#7A4E32,#5E3B25);border-radius:22px;box-shadow:inset 0 3px 0 rgba(255,255,255,.12)}
.key{border:0;border-radius:11px;height:var(--h);background:var(--c);box-shadow:inset 0 -7px 0 rgba(0,0,0,.18),inset 0 5px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.3);position:relative;min-width:0}
.key::before,.key::after{content:'';position:absolute;left:50%;width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.75);transform:translateX(-50%)}
.key::before{top:9px}.key::after{bottom:11px}
.key.hit,.key:active{transform:translateY(3px);filter:brightness(1.18)}
.melody{display:flex;flex-wrap:wrap;gap:6px;min-height:48px;align-items:center;padding:10px 12px;border:2px dashed var(--line);border-radius:18px;background:#fff}
.nd{width:20px;height:20px;border-radius:50%}
.nd.long{width:34px;border-radius:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:8px}
.row3 .btn{padding-inline:8px;font-size:17px}

/* designer */
.sec{padding-block:16px 4px;display:grid;gap:10px}
.sec h2{font-size:23px}
.scroller{display:flex;gap:10px;overflow-x:auto;margin-inline:-16px;padding:2px 16px 8px;scroll-snap-type:x proximity;scrollbar-width:none}
.scroller::-webkit-scrollbar{display:none}
.sp{flex:0 0 auto;width:100px;border:2px solid var(--line);border-radius:22px;background:linear-gradient(var(--sky1),var(--sky2));padding:0 0 8px;overflow:hidden;scroll-snap-align:start;display:grid;gap:2px;justify-items:center}
.sp svg{width:100%;height:86px;display:block}
.sp span{font-weight:700;font-size:14px}
.sp[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--sun)}
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:9px}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px var(--line);padding:0;min-width:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);transform:scale(1.08)}
.sw.none{background:repeating-linear-gradient(45deg,#fff 0 5px,#EEE 5px 10px)}
.namerow{display:flex;gap:8px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(255,248,236,.95);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:2px solid var(--line);z-index:10}
.bar .inner{max-width:528px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* sheet, toast, confetti */
.sheet-back{position:fixed;inset:0;background:rgba(31,48,71,.4);z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--paper);border-radius:28px 28px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-width:560px;margin:0 auto;box-shadow:0 -10px 40px -10px rgba(0,0,0,.3)}
.sheet h2{font-size:26px}
.sheet label{font-weight:700}
.sheet .srow{display:flex;justify-content:space-between;align-items:center;gap:12px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:18px;font-weight:700;z-index:40;max-width:calc(100% - 32px);text-align:center;box-shadow:0 10px 30px -10px rgba(0,0,0,.5)}
#toast.win{background:var(--leaf2);font-family:var(--display);font-size:21px}
.feather{position:fixed;top:-40px;width:22px;height:40px;pointer-events:none;z-index:45;animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}
.loading{display:grid;place-items:center;gap:10px;min-height:60vh;text-align:center;color:var(--ink2)}
.loading b{font-family:var(--display);font-size:28px;color:var(--ink)}
@media (prefers-reduced-motion: reduce){.pop,.flash,.heart{animation:none}.feather{display:none}}
</style>
</head>
<body>


<div id="app"><div class="loading"><b>Opening the aviary…</b><span>Waking up the birds</span></div></div>
<div id="sheet" hidden></div>
<div id="toast" hidden></div>

<script>
(() => {
'use strict';

/* ---------- small helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const uid = () => 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));
const lerp = (a, b, t) => a + (b - a) * t;
const DEG = Math.PI / 180;
const P = (x, y) => ({x, y});
const add = (a, b) => P(a.x + b.x, a.y + b.y);
const mul = (a, k) => P(a.x * k, a.y * k);
const lp = (a, b, t) => P(lerp(a.x, b.x, t), lerp(a.y, b.y, t));
const f1 = n => Math.round(n * 10) / 10;
const pt = p => f1(p.x) + ',' + f1(p.y);
const rot = (p, c, deg) => { const a = deg * DEG, dx = p.x - c.x, dy = p.y - c.y; return P(c.x + dx * Math.cos(a) - dy * Math.sin(a), c.y + dx * Math.sin(a) + dy * Math.cos(a)); };
function hex2rgb(h) { h = String(h).replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16) || 0; return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function rgb2hex(r, g, b) { return '#' + [r, g, b].map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join(''); }
function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(lerp(A[0], B[0], t), lerp(A[1], B[1], t), lerp(A[2], B[2], t)); }
const light = (c, t) => mix(c, '#ffffff', t), dark = (c, t) => mix(c, '#000000', t);
function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed || 1; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hasClaude = !!(window.claude && typeof window.claude.use === 'function');
const MIC = !hasClaude && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);

/* ---------- the birds ---------- */
const SPECIES = {
  cockatiel: {
    label: 'Cockatiel', talk: 2, sing: 5,
    body: {rx: 40, ry: 62}, headR: 30, tail: {len: 140, w: 22, tip: 'point'}, beak: {type: 'hook', s: .78},
    crest: 'tiel', face: {dx: .35, dy: .2, rx: .85, ry: .85}, cheek: 'tiel', wingPatch: 'band', patch: null, scale: 1, tex: .1,
    voice: {pitch: 1.9, rate: 1.1}, call: 'tiel', needs: {word: 5, tune: 2}, whistleBase: 1046.5,
    parts: ['body','head','face','crest','cheek','belly','wing','wingPatch','wingTip','tail','beak','iris','feet'],
    looks: {
      normal: {label: 'Normal grey', colors: {body:'#8F8D8A', belly:'#9A9894', head:'#A09C94', face:'#F6D94B', crest:'#E8CF5C', cheek:'#F0873A', wing:'#86837F', wingPatch:'#F5F2EA', wingTip:'#57544F', tail:'#6E6B67', tailTip:'#55524E', beak:'#9C958F', feet:'#B8A8A0'}},
      lutino: {label: 'Lutino', colors: {body:'#F6EFD8', belly:'#F8F2DE', head:'#FAF1CF', face:'#FBE36A', crest:'#F9E27A', cheek:'#F28A3A', wing:'#F3EBD2', wingPatch:'#FFFDF7', wingTip:'#EDE3C4', tail:'#F1E8C9', tailTip:'#EBDDB5', beak:'#EBDCC2', feet:'#F1C9BC', iris:'#7A1F24'}},
      pearl: {label: 'Pearl', pattern: 'pearl', pc: '#F2DC8A', colors: {body:'#8F8D8A', belly:'#9A9894', head:'#A09C94', face:'#F6D94B', crest:'#E8CF5C', cheek:'#F0873A', wing:'#86837F', wingPatch:'#F5F2EA', wingTip:'#57544F', tail:'#6E6B67', tailTip:'#55524E', beak:'#9C958F', feet:'#B8A8A0'}},
      pied: {label: 'Pied', pattern: 'pied', pc: '#F6F0DA', colors: {body:'#8F8D8A', belly:'#9A9894', head:'#A09C94', face:'#F6D94B', crest:'#E8CF5C', cheek:'#F0873A', wing:'#86837F', wingPatch:'#F5F2EA', wingTip:'#57544F', tail:'#6E6B67', tailTip:'#55524E', beak:'#9C958F', feet:'#B8A8A0'}},
      whiteface: {label: 'Whiteface', colors: {body:'#8C8C8C', belly:'#979797', head:'#9A9A9A', face:'#F4F4F2', crest:'#DCDCDA', cheek:'#EFEFED', wing:'#848484', wingPatch:'#F5F5F3', wingTip:'#555555', tail:'#6B6B6B', tailTip:'#525252', beak:'#9C958F', feet:'#B5ABA6'}}
    },
    facts: ['Cockatiels come from Australia, where they fly around in big flocks.', 'A cockatiel’s crest shows its mood: straight up means curious or excited, flat means scared or grumpy.', 'Cockatiels are the smallest members of the cockatoo family.', 'Boy cockatiels are usually the big whistlers and talkers.', 'Cockatiels love head scratches — they lower their heads and close their eyes when they want one.', 'With good care, a cockatiel can live 15 to 25 years.']
  },
  budgie: {

/* parrot mode: record Havi, the bird copies her voice */
const Rec = {stream: null, node: null, chunks: null, pressing: false, last: null};

  const upH = e => { if (!Rec.pressing) return; e.preventDefault(); Rec.pressing = false; btn.classList.remove('rec'); btn.lastChild.textContent = ' Hold to talk'; micStop(); };

}
async function micStart() {

  catch (e) { Rec.pressing = false; const b = $('#micBtn'); if (b) { b.classList.remove('rec'); b.lastChild.textContent = ' Hold to talk'; } toast('The microphone is off. A grown-up can turn it on in Settings.'); return; }

  if (!wasRecording || !chunks) return;
  const ctx = AU.ctx, sr = ctx.sampleRate, len = chunks.reduce((a, c) => a + c.length, 0);
  if (len < sr * .35) { toast('Keep holding the button while you talk.'); return; }
  const all = new Float32Array(len); let o = 0; chunks.forEach(c => { all.set(c, o); o += c.length; });
  let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(all[i]));

  setTimeout(() => parrotPlay(buf), 650);

function parrotPlay(buf) {
  const b = cur(); const ctx = audio(); if (!b || !ctx || !actor) return;
  const rate = PARROT_RATE[b.species] || 1.3, t = ctx.currentTime + .16;
  tone(ctx.currentTime + .01, .09, [[0, 2600], [1, 3400]], {vol: .07});

const SCALE = [0, 2, 4, 5, 7, 9, 11, 12];

  birthday: {name: 'Happy Birthday', notes: [[0, .75], [0, .25], [2, 1], [0, 1], [5, 1], [4, 2], [0, .75], [0, .25], [2, 1], [0, 1], [7, 1], [5, 2]]},
  mac: {name: 'Old MacDonald', notes: [[5, 1], [5, 1], [5, 1], [0, 1], [2, 1], [2, 1], [0, 2], [9, 1], [9, 1], [7, 1], [7, 1], [5, 2]]},
  mary: {name: 'Mary’s Lamb', notes: [[4, 1], [2, 1], [0, 1], [2, 1], [4, 1], [4, 1], [4, 2], [2, 1], [2, 1], [2, 2], [4, 1], [7, 1], [7, 2]]}

function melodyHTML() {
  const tn = S.tune;
  if (!tn || (!tn.special && !tn.notes.length)) return '<span class="empty">Tap the colored bars to make a tune</span>';
  if (tn.special) return `<b>〜 ${esc(tn.name)} 〜</b>`;
  return tn.notes.map(([s, bt]) => `<span class="nd ${bt >= 2 ? 'long' : ''}" style="background:${semiColor(s)}"></span>`).join('');

function renderWhistle(p) {
  const b = cur(), sp = SPECIES[b.species], need = sp.needs.tune, lesson = findTune(b, S.tune);
  const known = b.tunes.slice().sort((x, y) => (y.learned ? 1 : 0) - (x.learned ? 1 : 0));
  p.innerHTML = `
  <p>Play a little tune on the xylophone, then teach it to ${esc(b.name)}.</p>
  <div class="xylo">${SCALE.map((s, i) => `<button class="key" data-k="${i}" style="--c:${KEYC[i]};--h:${100 - i * 6}%" aria-label="Note ${i + 1}"></button>`).join('')}</div>
  <div class="melody" id="melody">${melodyHTML()}</div>
  <div class="row3"><button class="btn" id="tPlay">${IC.play} Play</button><button class="btn" id="tClear">Clear</button><button class="btn go" id="tTeach">Teach ${esc(b.name)}</button></div>

    e.preventDefault(); const i = +k.dataset.k; const ctx = audio(); if (ctx) mallet(ctx.currentTime + .005, 523.25 * Math.pow(2, SCALE[i] / 12));
    k.classList.add('hit'); setTimeout(() => k.classList.remove('hit'), 140);

  $$('[data-preset]', p).forEach(el => el.onclick = () => { const k = el.dataset.preset, t = TUNES[k]; S.tune = {preset: k, name: t.name, special: t.special || null, notes: t.notes ? clone(t.notes) : null}; renderWhistle(p); if (!isBusy()) kidPlay(S.tune); });

}
function kidPlay(tn) {

  if (ctx) { const t = ctx.currentTime + .05; if (tn.special === 'wolf') dur = wolf(t, .12, .8); else { let x = t; tn.notes.forEach(([s, bt]) => { mallet(x, 523.25 * Math.pow(2, s / 12), .2); x += bt * .32; }); dur = x - t; } }

  let rec = findTune(b, tn);
  if (!rec) { if (b.tunes.length >= 20) { toast(`${b.name} knows lots of songs! Forget one first.`); return; } const n = b.tunes.filter(x => !x.special && !TUNES[x.preset]).length + 1; rec = {id: uid(), name: tn.name || `${kid()}’s song ${n}`, preset: tn.preset || null, special: tn.special || null, notes: tn.notes ? clone(tn.notes) : null, reps: 0, learned: false}; b.tunes.push(rec); }

  <div class="bar"><div class="inner"><button class="btn" id="dSurprise">${IC.sparkle} Surprise!</button><button class="btn go" id="dSave">${DZ.isNew ? 'Hatch!' : 'Save'}</button></div></div>`;
  drawD(); renderDesignControls();
  $$('#spList .sp').forEach(el => el.onclick = () => { if (el.dataset.sp === D.species) return; D.species = el.dataset.sp; applyLook(D, Object.keys(SPECIES[D.species].looks)[0]); if (!SPECIES[D.species].parts.includes(S.part)) S.part = 'body'; dirty(); $$('#spList .sp').forEach(x => x.setAttribute('aria-pressed', x === el)); drawD(true); renderDesignControls(); });
  $('#dstage').addEventListener('click', e => {
    const el = e.target.closest('[data-part]'); if (!el) return; let part = el.dataset.part; const parts = SPECIES[D.species].parts;
    const fallback = {lowerBeak: 'beak', cere: 'beak', belly: 'body', wingPatch: 'wing', wingTip: 'wing', tailTip: 'tail', face: 'head', ring: 'head', cheek: 'head', crest: 'head', feet: 'body', iris: 'head'};
    while (!parts.includes(part) && fallback[part]) part = fallback[part];
    if (!parts.includes(part)) part = 'body';
    S.part = part; sfx('pop'); renderParts(); renderSwatches(); flashPart(part);
  });
  $('#birdName').oninput = e => { D.name = e.target.value.slice(0, 16); dirty(); };
  $('#dice').onclick = () => { D.name = pick(NAMES.filter(n => n !== D.name)); $('#birdName').value = D.name; dirty(); sfx('pop'); };
  $('#dSurprise').onclick = surprise;
  $('#dSave').onclick = saveDesign;
  $('#dBack').onclick = () => { if (DZ.dirty && Date.now() - DZ.armedBack > 3000) { DZ.armedBack = Date.now(); toast('Tap Save to keep your bird. Tap back again to leave without saving.'); return; } DZ.isNew ? go('aviary') : go('room', D.id); };
  const del = $('#dDelete');
  if (del) del.onclick = () => { if (Date.now() - DZ.armedDel > 3000) { DZ.armedDel = Date.now(); del.textContent = `Tap again to say goodbye to ${D.name}`; setTimeout(() => { if (del.isConnected) del.textContent = `Let ${D.name} fly away`; }, 3000); return; } Store.remove(D.id); toast(`${D.name} flew off to a happy forest.`); go('aviary'); };
}
function dirty() { DZ.dirty = true; }
function drawD(call) {
  stopActor(); const host = $('#dbird'); host.innerHTML = birdSVG(D, 'd'); actor = new Actor(host, 'd'); actor.excite(900);
  const sp = SPECIES[D.species]; $('#spBlurb').textContent = `${sp.label}: talking ${stars(sp.talk)} · whistling ${stars(sp.sing)}`;
  if (call) { const ctx = audio(); if (ctx) { const d = CALLS[sp.call](ctx.currentTime + .02); actor.chirpMove(d); } }
}
function flashPart(part) { $$(`#dbird [data-part="${part}"]`).forEach(el => { el.classList.remove('flash'); void el.getBoundingClientRect(); el.classList.add('flash'); }); }
function renderDesignControls() { renderLooks(); renderParts(); renderSwatches(); renderPatterns(); renderAccs(); }
function renderLooks() {
  const sp = SPECIES[D.species];
  $('#looks').innerHTML = Object.entries(sp.looks).map(([k, l]) => `<button class="chip" data-look="${k}" aria-pressed="${D.look === k}"><i style="background:${l.colors.body}"></i><i style="background:${l.colors.face || l.colors.head || l.colors.belly}"></i><i style="background:${l.colors.wingTip || l.colors.tail}"></i>${esc(l.label)}</button>`).join('');
  $$('#looks [data-look]').forEach(el => el.onclick = () => { applyLook(D, el.dataset.look); dirty(); sfx('pop'); drawD(); renderDesignControls(); });
}
function renderParts() {
  const sp = SPECIES[D.species];
  $('#parts').innerHTML = sp.parts.map(p => `<button class="chip" data-pp="${p}" aria-pressed="${S.part === p}"><i style="background:${D.colors[p] === 'none' ? '#fff' : D.colors[p]}"></i>${PART_LABEL[p]}</button>`).join('');
  $$('#parts [data-pp]').forEach(el => el.onclick = () => { S.part = el.dataset.pp; sfx('pop'); renderParts(); renderSwatches(); flashPart(S.part); });
}
function renderSwatches() {
  const curC = (D.colors[S.part] || '').toUpperCase();
  const none = S.part === 'ring' ? `<button class="sw none" data-sw="none" aria-label="No eye ring" aria-pressed="${curC === 'NONE'}"></button>` : '';
  $('#swatches').innerHTML = none + SWATCHES.map(([c, n]) => `<button class="sw" data-sw="${c}" aria-label="${n}" aria-pressed="${curC === c.toUpperCase()}" style="background:${c}"></button>`).join('');
  $$('#swatches [data-sw]').forEach(el => el.onclick = () => paint(el.dataset.sw));
}
function paint(color) {
  const sp = SPECIES[D.species]; D.colors[S.part] = color;
  (LINKS[S.part] || []).forEach(([child, fn]) => { if (!sp.parts.includes(child)) D.colors[child] = fn(color); });
  D.look = null; dirty(); sfx('pop'); drawD(); renderLooks(); renderParts(); renderSwatches();
}
function renderPatterns() {
  $('#patterns').innerHTML = PATTERNS.map(([k, n]) => `<button class="chip" data-pat="${k}" aria-pressed="${D.pattern === k}">${n}</button>`).join('');
  $$('#patterns [data-pat]').forEach(el => el.onclick = () => { D.pattern = el.dataset.pat; if (PATTERN_PC[D.pattern]) D.pc = PATTERN_PC[D.pattern]; dirty(); sfx('pop'); drawD(); renderPatterns(); });
  const pcEl = $('#pcolors'); const needs = !['plain', 'rainbow'].includes(D.pattern); pcEl.hidden = !needs;
  if (needs) { pcEl.innerHTML = SWATCHES.map(([c, n]) => `<button class="sw" data-pc="${c}" aria-label="${n} pattern" aria-pressed="${(D.pc || '').toUpperCase() === c.toUpperCase()}" style="background:${c}"></button>`).join(''); $$('#pcolors [data-pc]').forEach(el => el.onclick = () => { D.pc = el.dataset.pc; dirty(); sfx('pop'); drawD(); renderPatterns(); }); }
}
function renderAccs() {
  $('#accs').innerHTML = ACCS.map(([k, n]) => `<button class="chip" data-acc="${k}" aria-pressed="${D.accessory === k}">${n}</button>`).join('');
  $$('#accs [data-acc]').forEach(el => el.onclick = () => { D.accessory = el.dataset.acc; dirty(); sfx('pop'); drawD(); renderAccs(); });
}
function surprise() {
  const sp = SPECIES[D.species]; const pal = SWATCHES.map(s => s[0]).sort(() => Math.random() - .5);
  const [a, b2, c3] = pal; const cols = {...D.colors};
  sp.parts.forEach(p => { if (p === 'iris') return; if (p === 'beak' || p === 'lowerBeak') { cols[p] = pick(['#2A2A2C', '#EFE5D3', '#EFC6A4', '#9C958F', '#F5C024', '#E4413B']); return; } if (p === 'ring') { cols[p] = pick(['none', '#FFFFFF', '#DCEAF4']); return; } if (p === 'feet') { cols[p] = pick(['#B8A8A0', '#9A9A9A', '#E8B9A0']); return; } cols[p] = pick([a, a, b2, c3, light(a, .3), dark(b2, .2)]); });
  sp.parts.forEach(p => (LINKS[p] || []).forEach(([child, fn]) => { if (!sp.parts.includes(child)) cols[child] = fn(cols[p]); }));
  D.colors = completeColors(cols); D.look = null;
  D.pattern = Math.random() < .45 ? pick(['pearl', 'pied', 'bars', 'rainbow', 'sparkles']) : 'plain'; D.pc = pick(pal.slice(3, 9));
  if (Math.random() < .35) D.accessory = pick(ACCS.slice(1))[0];
  dirty(); drawD(true); renderDesignControls();
}
function saveDesign() {
  D.name = (($('#birdName').value || '').trim() || pick(NAMES)).slice(0, 16);
  const sp = SPECIES[D.species];
  const target = DZ.isNew ? D : Object.assign(Store.birds.get(D.id) || {}, D);
  if (DZ.isNew) target.created = Date.now();
  Store.save(target); DZ.dirty = false; sfx('win');
  toast(DZ.isNew ? `${target.name} the ${sp.label.toLowerCase()} hatched!` : `Saved ${target.name}!`, true);
  go('room', target.id);
}

/* ---------- settings ---------- */
function openSettings() {
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-back" id="sheetBack"></div><div class="sheet" role="dialog" aria-label="Settings"><h2>Settings</h2>
    <label for="kidName">Who keeps these birds?</label><input id="kidName" maxlength="20" value="${esc(kid())}" autocomplete="off">
    <div class="srow"><span><b>Sounds &amp; voices</b><br><span class="fine">Turn up the volume. On iPhone, check the silent switch too.</span></span><button class="chip" id="soundToggle" aria-pressed="${AU.on}">${AU.on ? 'On' : 'Off'}</button></div>
    <p class="fine">${Store.mode === 'db' && !Store.readOnly ? 'Birds are saved to your Claude account, so they’re here on any device you sign in on.' : 'Birds are saved in this browser on this device.'}</p>
    <button class="btn go" id="sheetDone">Done</button></div>`;
  sh.hidden = false;
  const close = () => { const v = ($('#kidName').value || '').trim().slice(0, 20); if (v && v !== Store.settings.kidName) { Store.settings.kidName = v; Store.saveSettings(); } closeSheet(); if (S.screen === 'aviary') renderAviary(); };
  $('#sheetBack').onclick = close; $('#sheetDone').onclick = close;
  $('#soundToggle').onclick = e => { AU.on = !AU.on; Store.settings.sound = AU.on; Store.saveSettings(); e.currentTarget.setAttribute('aria-pressed', AU.on); e.currentTarget.textContent = AU.on ? 'On' : 'Off'; if (!AU.on && 'speechSynthesis' in window) speechSynthesis.cancel(); };
}
function closeSheet() { const sh = $('#sheet'); if (sh) { sh.hidden = true; sh.innerHTML = ''; } }

/* ---------- boot ---------- */
(async function boot() {
  Store.loadLocal();
  AU.on = Store.settings.sound !== false;
  if (!hasClaude) { Store.seedLocal(); renderAviary(); return; }
  if (Store.birds.size) renderAviary();
  await Store.connect();
  AU.on = Store.settings.sound !== false;
  if (S.screen === 'aviary' || S.screen === 'loading') renderAviary();
})();
})();
</script>

<script>if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
